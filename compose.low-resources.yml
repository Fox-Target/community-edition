# Surcouche optionnelle pour VPS très limité (1 vCPU, 1–2 Go de RAM, disque lent).
#
# Usage :
#   docker compose -f compose.yml -f compose.low-resources.yml up -d
#
# Ce que ça change :
#   1. Healthchecks beaucoup plus tolérants. Avec les valeurs par défaut
#      (start_period 1m, interval 30s, retries 3), ClickHouse doit être prêt
#      en ~2m30 sinon Compose abandonne avec
#      "dependency failed to start: container plausible_events_db is unhealthy".
#      Sur un disque lent et/ou avec un volume d'événements qui grossit, ce
#      délai finit par être dépassé — d'où des déploiements qui marchaient
#      puis échouent systématiquement.
#   2. Bridage mémoire supplémentaire de ClickHouse (clickhouse/tiny-vps.xml).
#   3. Rotation des logs Docker, pour ne pas remplir le disque.

services:
  plausible_db:
    healthcheck:
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 5m
    logging: &small-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  plausible_events_db:
    volumes:
      # Chargé après low-resources.xml (ordre alphabétique dans config.d),
      # donc ses valeurs écrasent bien les précédentes.
      - ./clickhouse/tiny-vps.xml:/etc/clickhouse-server/config.d/tiny-vps.xml:ro
    healthcheck:
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 5m
    logging: *small-logs

  plausible:
    logging: *small-logs
